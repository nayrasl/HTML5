<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Tabela 2</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
        }
        table{
            width: 600px;
            border-collapse: collapse;

        }
        td,th{
            border: 1px solid black;
            padding: 10px;

        }
        thead,tfoot{
            background-color: gray;
            color: white;
        }
        .num{
            text-align: right;
        }
        caption{
            font-size: 1em;
            padding: 10px;
            background-color: rgb(177, 171, 171);
            color: black;
            font-weight: bolder;
        }
        tbody > tr:nth-child(2n){
            background-color: lightgray;
        }
        thead > tr > th {
            position: sticky;
            top: 0;
            background-color: gray;
        }
        div{
            overflow-x: auto;
        }

    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>

    <div><table> 
    <caption>População de alguns Estados</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 90px;">População</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 04</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 168 791</td>
            </tr>
            <tr> 
                <td> Rio de Janeiro</td>
                <td class="num">17 264 943</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">148 730 64</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">11 433 957</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de habitantes:</th>
                <td class="num">110 659 804</td>
            </tr>

        </tfoot>
    </table></div>
</body>
</html>
