<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>

            <div id="formulario">
                <h1>Login</h1>

                <p>Seja bem-vindo(a) novamente! Preencha seu login e senha para acessar o seu ambiente. </p>

                <form action="login.php" method="post" autocomplete="on">
                  <div class="campo">
                   <span class="material-symbols-outlined"> person</span>
                        <input type="text" name="login"id="ilogin"  autocomplete="email" placeholder="Digite seu email" maxlength="30" >
                    <label for="ilogin">Login</label> 
                    </div>

                <div class="campo">
                   <span class="material-symbols-outlined"> key </span> 
                    
                   <input type="password" name="senha"id="isenha" required minlength="8" maxlength="20" autocomplete="current-password" placeholder="Sua senha">
                    <label for="isenha">Senha</label> 
                </div>
               
                    <input type="submit" value="Enviar">
                    <a href="esqueci.html" class="botao"> Esqueci a senha <i class="material-symbols-outlined">mail</i></a>

                </form>

            </div>

        </section>
    </main>
</body>
</html>
