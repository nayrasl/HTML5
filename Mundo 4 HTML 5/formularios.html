<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <fieldset> <legend>Formulário</legend>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p>
            <label for="inome"> Nome: </label>
            <input type="text" name="nome" id="inome"> </p>
        <p> 
            <label for="isobrenome">
            Sobrenome: </label> 
            <input type="text" name="sobrenome" id="isobrenome"></p> 
        <p>
        <input type="submit" value="Enviar"></p>
    </form>
</fieldset>


    <h1>Login</h1>
    <fieldset> <legend>Login</legend>
    <form action="cadastro.php" method="post" autocomplete="on">
    <p><label for="iusu">Usuário: </label>
    <input type="text" name="usu" id="iusu" required maxlength="10"></p>
    <p><label for="isenha">Senha: </label>
    <input type="password" name="senha" id="isenha" required minlength="4" maxlength="8">
    </p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</form>
</fieldset>


<h1>Notas</h1>
<fieldset><legend>Notas</legend>
<form action="cadastro.php" method="get">
   <p><label for="ialuno">Aluno: </label>
    <input type="text" name="aluno" id="ialuno" required></p> 
    <p>
        <label for="inota">Nota: </label>
        <input type="number" name="nota" id="inota" required max="10"  step="0.1" placeholder="0 a 10">
    </p>
    <p>
        <label for="imes">Mês: </label>
        <input type="month" name="mes" id="imes" required value="2026-05">
    </p>
    <p><input type="submit" value="Enviar"> 
    <input type="reset" value="Limpar"></p>

</form></fieldset>
<br><br>
<fieldset>
<h1>Rádio</h1>
<fieldset> <legend>Sexo</legend>
<form action="cadastro.php">
    <input type="radio" name="sexo"
    id="imas"> <label for="imas"> Masculino</label> <br>
    <input type="radio" name="sexo" id="ifem"><label for="ifem"> Feminino</label>
</form>
</fieldset>

<h1>Checkbox</h1>
<fieldset>
    <legend>Esportes favoritos</legend>
    <form action="cadastro.php">
        <input type="checkbox" name="fut" id="ifut"><label for="ifut"> Futebol</label><br>
        <input type="checkbox" name="bas" id="ibas"><label for="ibas"> Basquete</label><br>
        <input type="checkbox" name="nat" id="inat"><label for="inat"> Natação</label>

    </form>
</fieldset>
<p>
    <input type="submit" value="Enviar ">
    <input type="reset" value="Limpar">
</p>
</fieldset>

<h1>Color, range e file</h1>
<fieldset>
<form action="cadastro.php"
method="post">
<p>
<label for="icor">Cor: </label>
<input type="color" name="cor"
id="icor">
</p>
<p>
<label for="ivol">Volume: </label>
<input type="range" name="vol" id="ivol" min="0" max="100">
</p>
<p>
    <label for="iarq">Selecione o arquivo: </label>
    <input type="file" name="arq" id="iarq"></p>
    <p><input type="submit" value="Enviar">
    <input type="reset"
    value="Limpar"></p>
</form>
</fieldset>

<h1>Select Datalist e Textarea</h1>
<fieldset>
    <p><label for="iest">Estado: </label>
    <select name="est" id="iest">
        <optgroup label="Sudeste">
        <option value="MG">Minas Gerais</option>
        <option value="SP">São Paulo</option>
        <option value="ES">Espirito Santo</option>
        <option value="RJ">Rio de Janeiro</option>
    </optgroup>
    <optgroup label="Nordeste">
        <option value="MA">Maranhão</option>
        <option value="BA">Bahia</option>
        <option value="PE"> Pernambuco</option>
        <option value="PB">Paraíba</option>
    </optgroup>
    </select></p>
<p>
<label for="icid">Cidade: </label>
<input type="text" name="cid" id="icid" list="liscid">
<datalist id="liscid">
    <option value="SL">São Luis</option>
    <option value="SV">Salvador</option>
    <option value="RF">Recife</option>
    <option value="JP">João Pessoa</option>
    <option value="S">São Paulo</option>
    <option value="R">Rio de Janeiro</option>
    <option value="VT">Vitória</option>
    <option value="BH">Belo Horizonte</option>
</datalist>
</p>


<p><label for="icom">Comentário: </label>
<textarea name="com" id="icom" cols="50" rows="6"></textarea>
</p> 
<p><input type="submit" value="Enviar">
<input type="reset" value="Limpar"></p>
</fieldset>
<h1>Output</h1>
<fieldset><legend>Output</legend>
<form action="cadastro.php" method="get" autocomplete="on">
<p>
    <label for="in1">Número 1: </label>
    <input type="number" name="n1" id="in1" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value)+Number(in2.value)">
</p>

<p>
    <label for="in2">Número 2: </label>
    <input type="number" name="n2" id="in2" min="0" max="50" required oninput="isoma.innerHTML= Number(in1.value)+Number(in2.value)">
</p>
<p>
<label for="isoma">Soma: </label>
<output name="soma" id="isoma">0</output></p>

<p>
    <input type="range" name="vol"
    id="ivol" min="0" max="100" value="50" oninput="ival.innerHTML = Number(ivol.value)">
    <output id="ival">50</output>
</p>
<p>Obs: Id do input é um e o Id do Output e oninput é outro.</p>
<p><input type="submit" value="Enviar">
<input type="reset" value="Limpar"></p>

<fieldset><legend>Cálculo de idade</legend>
    <p>
        <label for="iano">Em que ano você nasceu? </label>
        <input type="number" name="ano" id="iano" min="1900" max="2026"
        oninput="calIdade()">
        <label for="iidade">Sua idade é: </label>
        <output id="iidade">0</output>
    </p>
</fieldset>
</form>
<script> 
    function calIdade(){let atual = new Date().getFullYear() 
        iidade.innerHTML = Number(atual)-Number(iano.value)
    }
</script>
</fieldset>

</body>
</html>
