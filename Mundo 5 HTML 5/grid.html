<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
          display:grid;
          grid-template-rows: repeat(3,100px);
          grid-template-columns: repeat(4,1fr);

          background-color: rgb(246, 243, 243);

          gap: 5px;
            
            
        }
        .caixa1{
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;

            background-color: brown;

        

        }
        .caixa2{
            grid-row: 2 / 4;
            grid-column: 1 / 3;

            background-color: aqua
        }

        .caixa3{
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;

            background-color: coral;
        }


            
        
    </style>
</head>
<body>
   <div class="container">
    <div class="caixa1">Caixa 1</div>
    <div class="caixa2">Caixa 2 </div>
    <div class="caixa3">Caixa 3</div>
    

   </div>
    
</body>
</html>
