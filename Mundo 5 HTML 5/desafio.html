<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            width: 100vw;
            display: grid;
            grid-template: 80px 40px 1fr 40px / 1fr 150px;
            gap: 5px;
            

        }
        .borda{
            border: 1px solid black;
            text-align: center;
        }
        .topo{
            grid-row: 1/1;
            grid-column: 1/-1;
            

        }
        .menu{
            grid-row: 2/2;
            grid-column: 1/-1;

        }
        .principal{
            grid-row: 3/3;
            grid-column: 1/2;

        }
        .secundario{
            grid-row: 3/3;
            grid-column: 2/-1;
        }
        .rodape{
            grid-row: 4/4;
            grid-column: 1/-1;

        }



    </style>
</head>
<body>
    <div class="container borda">
        <div class="topo borda">topo</div>
        <div class="menu borda">menu</div>
        <div class="principal borda">principal</div>
        <div class="secundario borda">secundario</div>
        <div class="rodape borda">rodape</div>
    </div>
</body>
</html>
